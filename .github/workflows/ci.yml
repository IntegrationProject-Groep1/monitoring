name: CI Pipeline

on:
  push:
    branches: [ "main", "dev", "prod" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "dev", "prod" ]

jobs:

  validate:
    name: Validate configs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write test .env
        env:
          ENV_CONTENT: |
            ES_ADMIN_USER=elastic
            ES_ADMIN_PASS=elk123
            ES_MEM_LIMIT=512m
            KIBANA_SYSTEM_PASS=kibana123
            RABBITMQ_HOST=rabbitmq-test
            RABBITMQ_PORT=5672
            RABBITMQMONITORING_USER=monitoring_test
            RABBITMQMONITORING_PASS=monitoring_test_pass
            RABBITMQ_VHOST=/
        run: echo "$ENV_CONTENT" > monitoring_elk/.env

      - name: Mirror env file for docker compose service env_file lookups
        run: cp monitoring_elk/.env .env

      - name: Validate docker-compose syntax
        run: |
          docker compose --env-file monitoring_elk/.env \
            -f docker-compose.yml -f test/docker-compose.yml \
            config --quiet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check detector
        run: python -m py_compile detector/detector.py

  integration-test:
    name: Integration test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write test .env
        env:
          ENV_CONTENT: |
            ES_ADMIN_USER=elastic
            ES_ADMIN_PASS=elk123
            ES_MEM_LIMIT=512m
            KIBANA_SYSTEM_PASS=kibana123
            RABBITMQ_HOST=rabbitmq-test
            RABBITMQ_PORT=5672
            RABBITMQMONITORING_USER=monitoring_test
            RABBITMQMONITORING_PASS=monitoring_test_pass
            RABBITMQ_VHOST=/
        run: echo "$ENV_CONTENT" > monitoring_elk/.env

      - name: Mirror env file for docker compose service env_file lookups
        run: cp monitoring_elk/.env .env

      - name: Start stack (RabbitMQ + ELK + detector)
        run: |
          docker compose --env-file monitoring_elk/.env \
            -f docker-compose.yml -f test/docker-compose.yml \
            up -d --wait --wait-timeout 90 \
            rabbitmq elasticsearch logstash detector-service

      - name: Fix permissions for Logstash config (test compose bind mounts)
        run: |
          # Some CI runners enforce stricter file permissions on bind mounts; Logstash may fail with:
          # "error: open /usr/share/logstash/config/logstash.yml: permission denied"
          docker compose --env-file monitoring_elk/.env -f test/docker-compose.yml exec -T logstash \
            sh -c 'chmod 644 /usr/share/logstash/config/logstash.yml || true'


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r test/requirements.txt

      - name: Show compose service status
        run: docker compose --env-file monitoring_elk/.env -f docker-compose.yml -f test/docker-compose.yml ps

      - name: Wait for Logstash API
        run: |
          set -euo pipefail

          # 1) Wait for the HTTP endpoint to respond.
          # Note: Logstash is exposed on host port 9600 (docker-compose maps 127.0.0.1:9600:9600).
          # In GitHub Actions, localhost networking is stable, but the container may take longer than expected.
          for i in $(seq 1 48); do
            if curl -sSf http://localhost:9600/ -o /dev/null; then
              echo "Logstash API HTTP endpoint is responding"
              break
            fi
            echo "Waiting for Logstash API HTTP endpoint... ($i/48)"
            sleep 3
          done

          # 2) Then wait for at least one pipeline to be loaded.
          # Pipeline id/name is not guaranteed to be literally "main" across versions/timing.
          for i in $(seq 1 60); do
            # Pipelines object presence is usually enough to proceed.
            if curl -sSf http://localhost:9600/_node/pipelines | grep -q '"pipelines"'; then
              echo "Logstash pipelines object is present"
              exit 0
            fi

            # Fallback: check for any pipeline key-like structure.
            if curl -sSf http://localhost:9600/_node/pipelines | grep -Eq '"[^"]+"\s*:\s*\{'; then
              echo "Logstash pipeline(s) loaded"
              exit 0
            fi

            echo "Waiting for Logstash pipelines to load... ($i/60)"
            sleep 2
          done

          echo "Logstash pipelines did not become ready in time" >&2
          docker compose --env-file monitoring_elk/.env -f docker-compose.yml -f test/docker-compose.yml ps
          docker compose --env-file monitoring_elk/.env -f docker-compose.yml -f test/docker-compose.yml logs --no-color logstash || true
          exit 1




      - name: Send test heartbeats and platform logs
        run: python3 test/producer.py
        env:
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
          RABBITMQMONITORING_USER: monitoring_test
          RABBITMQMONITORING_PASS: monitoring_test_pass

      - name: Verify documents indexed in Elasticsearch
        run: python test/verify.py
        env:
          ES_HOST: http://localhost:30060
          ES_ADMIN_USER: elastic
          ES_ADMIN_PASS: elk123

      - name: Verify detector emits alert
        run: python3 test/verify_detector.py
        env:
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
          RABBITMQMONITORING_USER: monitoring_test
          RABBITMQMONITORING_PASS: monitoring_test_pass
          DETECTOR_RUN_REPORT_CONTAINER: detector-service

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose --env-file monitoring_elk/.env \
            -f docker-compose.yml -f test/docker-compose.yml \
            logs --no-color

      - name: Tear down
        if: always()
        run: |
          docker compose --env-file monitoring_elk/.env \
            -f docker-compose.yml -f test/docker-compose.yml down -v
